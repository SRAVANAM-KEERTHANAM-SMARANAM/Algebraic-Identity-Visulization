<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
        }
        #apps {
            max-width: 700px;
            margin: 30px auto;
        }
        ul {
            padding: 0;
            list-style: none;
        }
        li {
            margin: 12px 0;
        }
        a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            border: 1px solid #ccc;
            border-radius: 8px;
            color: inherit;
        }
        a:hover {
            text-decoration: underline;
        }
        .badge {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .badge-html {
            background: #e0f0ff;
            color: #0b5cab;
        }
        .badge-pdf {
            background: #ffe6e6;
            color: #b30000;
        }

        .badge-folder {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>My Applications</h1>
    <div id="apps">
        Loading applications...
    </div>
    <script>
        const owner = "SRAVANAM-KEERTHANAM-SMARANAM";
        const repo = "10th_Maths";
        const branch = "main";

        const container = document.getElementById("apps");
        let currentPath = "";

        async function getContents(path = "") {
            const url =
                `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Unable to access GitHub repository");
            }

            return await response.json();
        }

        function createItem(name, href, badgeText, badgeClass, isFolder = false) {
            const item = document.createElement("li");
            const link = document.createElement("a");

            link.href = href;

            const nameSpan = document.createElement("span");
            nameSpan.textContent = name;
            link.appendChild(nameSpan);

            const badge = document.createElement("span");
            badge.textContent = badgeText;
            badge.className = "badge " + badgeClass;
            link.appendChild(badge);

            if (isFolder) {
                link.addEventListener("click", function (event) {
                    event.preventDefault();
                    loadFolder(href);
                });
            }

            item.appendChild(link);
            return item;
        }

        async function loadRoot() {
            currentPath = "";
            container.textContent = "Loading folders...";

            try {
                const contents = await getContents("");

                // At repository root: show folders only.
                const folders = contents
                    .filter(item => item.type === "dir")
                    .sort((a, b) => a.name.localeCompare(b.name));

                if (folders.length === 0) {
                    container.textContent = "No folders found.";
                    return;
                }

                const list = document.createElement("ul");

                folders.forEach(folder => {
                    const item = createItem(
                        folder.name,
                        folder.path,
                        "FOLDER",
                        "badge-folder",
                        true
                    );
                    list.appendChild(item);
                });

                container.replaceChildren(list);

            } catch (error) {
                container.textContent = "Unable to load the folder list.";
                console.error(error);
            }
        }

        async function loadFolder(path) {
            currentPath = path;
            container.textContent = "Loading files...";

            try {
                const contents = await getContents(path);

                // Inside a subject folder: show HTML and PDF files only.
                const files = contents
                    .filter(item =>
                        item.type === "file" &&
                        (
                            item.name.toLowerCase().endsWith(".html") ||
                            item.name.toLowerCase().endsWith(".pdf")
                        ) &&
                        item.name.toLowerCase() !== "index.html"
                    )
                    .sort((a, b) => a.name.localeCompare(b.name));

                const list = document.createElement("ul");

                // Back button
                const backItem = document.createElement("li");
                const backLink = document.createElement("a");
                backLink.href = "#";
                backLink.textContent = "← Back to folders";
                backLink.addEventListener("click", function (event) {
                    event.preventDefault();
                    loadRoot();
                });
                backItem.appendChild(backLink);
                list.appendChild(backItem);

                if (files.length === 0) {
                    const emptyItem = document.createElement("li");
                    emptyItem.textContent = "No HTML or PDF files found in this folder.";
                    list.appendChild(emptyItem);
                } else {
                    files.forEach(file => {
                        const isPdf =
                            file.name.toLowerCase().endsWith(".pdf");

                        const item = createItem(
                            file.name.replace(/\.(html|pdf)$/i, ""),
                            file.path,
                            isPdf ? "PDF" : "HTML",
                            isPdf ? "badge-pdf" : "badge-html"
                        );

                        const link = item.querySelector("a");

                        // GitHub Pages path relative to this index.html
                        link.href = file.path
                            .split("/")
                            .map(part => encodeURIComponent(part))
                            .join("/");

                        list.appendChild(item);
                    });
                }

                container.replaceChildren(list);

            } catch (error) {
                container.textContent = "Unable to load the files in this folder.";
                console.error(error);
            }
        }

        // Start at the repository root.
        loadRoot();
    </script>
</body>
</html>
